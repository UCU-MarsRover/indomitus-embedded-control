[env:debug]
platform = espressif32@7.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
build_flags =
    -I include
    -D DEBUG_ENABLED
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
build_src_filter =
    +<main.cpp>

; CAN bring-up test. Sends a frame on 0x303 every second and logs all bus
; traffic. Own env because only one main() may be linked at a time.
[env:test_can]
platform = espressif32@7.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
build_flags =
    -I include
    -D DEBUG_ENABLED
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
build_src_filter =
    +<main_test_can.cpp>

[env:release]
platform = espressif32@7.0.0
board = esp32-c3-devkitm-1
