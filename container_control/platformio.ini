[env:debug]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
lib_deps =
    fastled/FastLED
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -I include
    -D DEBUG_ENABLED

[end:release]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
lib_deps =
    fastled/FastLED
    bogde/HX711@^0.7.5
build_flags =
    -I include