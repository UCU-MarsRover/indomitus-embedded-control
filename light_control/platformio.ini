[env:debug]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
lib_deps =
    fastled/FastLED
build_flags =
    -I include
    -D DEBUG_ENABLED

[env:release]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
lib_deps =
    fastled/FastLED
build_flags =
    -I include

[env:test_lights]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -I include
build_src_filter =
    +<main_test_lights.cpp>
