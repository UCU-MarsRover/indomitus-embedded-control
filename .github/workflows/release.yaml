name: Tag and Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    uses: UCUSpaceRobotics/.github/.github/workflows/version-tag.yml@main
    permissions:
      contents: write

  release:
    needs: tag
    uses: UCUSpaceRobotics/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
