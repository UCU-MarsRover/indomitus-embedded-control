; =============================================================================
; PlatformIO Configuration — Astro-Bio Gripper Sub-Controller
; Target: ESP32-C3 (Adafruit QT Py)
; =============================================================================

[env:adafruit_qtpy_esp32c3]
platform  = espressif32
board     = adafruit_qtpy_esp32c3
framework = arduino

; Serial monitor
monitor_speed = 115200

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include

; Ensure StateManager subdirectory under src/ is compiled
build_src_filter = +<*> +<StateManager/>
